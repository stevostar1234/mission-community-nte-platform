<svg xmlns="http://www.w3.org/2000/svg" width="960" height="825" viewBox="0 0 960 825"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#385365"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="45" y="20" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 20 H910 Q915 20 915 25 V53 H45 V25 Q45 20 50 20" fill="#1C3B50"/><text x="57" y="43" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">1  Create supplementary Lead</text><text x="57" y="76" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Staff, heavy-vehicle or logo form posts its target booking reference.</text><path d="M480 112 L480 130" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="130" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 130 H910 Q915 130 915 135 V163 H45 V135 Q45 130 50 130" fill="#1C3B50"/><text x="57" y="153" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">2  Reset submitted success fields and queue exact IDs</text><text x="57" y="186" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Creation Flow invokes applyUpdates; NTEUpdateSubmissionJob runs after commit.</text><path d="M480 222 L480 240" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="240" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 240 H910 Q915 240 915 245 V273 H45 V245 Q45 240 50 240" fill="#1C3B50"/><text x="57" y="263" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">3  Reload in creation and ID order and match reference</text><text x="57" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Require one eligible NTE booking; source event code does not retarget the reference.</text><path d="M480 332 L480 350" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="350" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 350 H910 Q915 350 915 355 V383 H45 V355 Q45 350 50 350" fill="#1C3B50"/><text x="57" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">4  Validate and merge accepted fields per booking</text><text x="57" y="406" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Check audience, declarations, roster counts, immutable top-up and complete vehicle groups.</text><path d="M480 442 L480 460" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="460" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 460 H910 Q915 460 915 465 V493 H45 V465 Q45 460 50 460" fill="#1C3B50"/><text x="57" y="483" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">5  Save booking changes and applied identity together</text><text x="57" y="516" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Savepoint protects the Opportunity update plus the Lead applied-booking audit.</text><path d="M480 552 L480 570" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="570" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 570 H910 Q915 570 915 575 V603 H45 V575 Q45 570 50 570" fill="#1C3B50"/><text x="57" y="593" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">6  Attempt staff or heavy-vehicle receipt separately</text><text x="57" y="626" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Use the matched booking Primary Contact; receipt failure preserves already saved data.</text><path d="M480 662 L480 680" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="680" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 680 H910 Q915 680 915 685 V713 H45 V685 Q45 680 50 680" fill="#1C3B50"/><text x="57" y="703" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">7  Keep or delete the source submission as appropriate</text><text x="57" y="736" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Delete eligible temporary staff/vehicle Leads only after accepted receipt; retain</text><text x="57" y="757" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">logo/error records.</text><text x="45" y="810" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#172D3E">Invalid or ambiguous requests remain auditable Leads. A receipt retry never reapplies booking changes.</text></svg>