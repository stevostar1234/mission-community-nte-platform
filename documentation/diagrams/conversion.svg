<svg xmlns="http://www.w3.org/2000/svg" width="960" height="825" viewBox="0 0 960 825"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#385365"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="45" y="20" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 20 H910 Q915 20 915 25 V53 H45 V25 Q45 20 50 20" fill="#1C3B50"/><text x="57" y="43" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">1  Review application</text><text x="57" y="76" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Operator chooses Account and Contact, then creates a new event Opportunity.</text><path d="M480 112 L480 130" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="130" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 130 H910 Q915 130 915 135 V163 H45 V135 Q45 130 50 130" fill="#1C3B50"/><text x="57" y="153" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">2  Native conversion supplies related identities</text><text x="57" y="186" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Salesforce supplies ConvertedAccountId, ConvertedContactId and ConvertedOpportunityId.</text><path d="M480 222 L480 240" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="240" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 240 H910 Q915 240 915 245 V273 H45 V245 Q45 240 50 240" fill="#1C3B50"/><text x="57" y="263" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">3  Reprice and copy in the conversion transaction</text><text x="57" y="296" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">NTEPricingService returns current pricedLead; Flow assigns exact booking fields and</text><text x="57" y="317" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Amount.</text><path d="M480 332 L480 350" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="350" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 350 H910 Q915 350 915 355 V383 H45 V355 Q45 350 50 350" fill="#1C3B50"/><text x="57" y="373" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">4  Save pending approval and participant classification</text><text x="57" y="406" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Flow queues explicit Lead and Opportunity IDs; Account/Contact get latest NTE summaries.</text><path d="M480 442 L480 460" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="460" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 460 H910 Q915 460 915 465 V493 H45 V465 Q45 460 50 460" fill="#1C3B50"/><text x="57" y="483" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">5  After commit prepare the optional Stripe request</text><text x="57" y="516" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">For selected paid Stripe bookings, create/reuse and verify the saved fixed charge/link.</text><path d="M480 552 L480 570" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="570" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 570 H910 Q915 570 915 575 V603 H45 V575 Q45 570 50 570" fill="#1C3B50"/><text x="57" y="593" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">6  Render to the exact Primary Contact and send</text><text x="57" y="626" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Validate saved price and preparation links; choose exhibitor, partner or complimentary</text><text x="57" y="647" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">copy.</text><path d="M480 662 L480 680" fill="none" stroke="#385365" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="680" width="870" height="92" rx="5" fill="#F6F8FA" stroke="#91A8B5"/><path d="M50 680 H910 Q915 680 915 685 V713 H45 V685 Q45 680 50 680" fill="#1C3B50"/><text x="57" y="703" text-anchor="start" font-family="Arial,sans-serif" font-size="20" fill="white">7  Persist the individual email outcome</text><text x="57" y="736" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">Opportunity approval audit plus Task; accepted Stripe email stamps quote/invoice, never</text><text x="57" y="757" text-anchor="start" font-family="Arial,sans-serif" font-size="18" fill="#172D3E">payment.</text><text x="45" y="810" text-anchor="start" font-family="Arial,sans-serif" font-size="16" fill="#172D3E">First manually recorded base payment later queues one distinct booking-confirmation dispatch.</text></svg>